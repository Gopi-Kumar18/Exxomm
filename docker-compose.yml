# docker-compose.yml
#
# Network topology (tiered, matches the production architecture):
#   frontend-tier : frontend <-> backend   (public-facing reverse proxy hop)
#   backend-tier  : backend  <-> mongo     (internal only, no external egress/ingress)
#
# All secret/config values below are placeholders resolved from the shell
# environment (a local .env file for dev, or Jenkins credentials sourced
# from AWS SSM Parameter Store at deploy time in CI/CD). Nothing here is
# hardcoded.

services:
  backend:
    build: ./exxomm-be
    image: exxomm-be-image:${IMAGE_TAG:-latest}
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    environment:
      # passing environment variables to backend container while creating it
      PORT: "3000"
      MONGO_USER: "${MONGO_USER}"
      MONGO_PASS: "${MONGO_PASS}"
      MONGO_DB_NAME: "${MONGO_DB_NAME}"
      MONGO_HOST: "${MONGO_HOST:-mongo}"
      MONGO_PORT: "${MONGO_PORT:-27017}"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      - mongo
    networks:
      - frontend-tier
      - backend-tier

  frontend:
    build: ./exxomm-fe
    image: exxomm-fe-image:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    environment:
      # resolved via Docker Compose service discovery on frontend-tier
      BACKEND_HOST: "${BACKEND_HOST:-backend}"
      BACKEND_PORT: "${BACKEND_CONTAINER_PORT:-3000}"
    depends_on:
      - backend
    networks:
      - frontend-tier

  mongo:
    image: mongo:${MONGO_IMAGE_TAG:-latest}
    environment:
      # passing environment variables to mongo container while creating it
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASS}"
      MONGO_INITDB_DATABASE: "${MONGO_DB_NAME}"
    # No "ports:" published to the host — the DB tier is internal-only and
    # is reachable exclusively from the backend over backend-tier.
    volumes:
      - exxomm_db_volume:/data/db
    networks:
      - backend-tier

volumes:
  exxomm_db_volume:
    name: exxomm_db_volume

networks:
  frontend-tier:
    driver: bridge
  backend-tier:
    driver: bridge
    internal: true
